plugins {
    id 'java'
    id 'org.springframework.boot' version '4.2.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'no.novari'
version = '0.0.1-SNAPSHOT'
description = 'qlik-to-sharepoint-sync'

ext['tomcat.version'] = '11.0.29'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(23)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webclient'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation 'com.microsoft.graph:microsoft-graph:6.70.0'
    implementation('com.azure:azure-identity:1.18.7') {
        exclude group: 'com.azure', module: 'azure-core-http-netty'
    }
    implementation 'com.azure:azure-core-http-jdk-httpclient:1.2.0'
    implementation 'com.google.guava:guava:33.8.0-jre'

    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'

    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'com.vaadin.external.google', module: 'android-json'
    }
    testImplementation 'org.json:json:20260814'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.24.0'
    testImplementation 'org.assertj:assertj-core:3.27.7'

    testImplementation 'com.squareup.okhttp3:mockwebserver:5.5.0'
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs "-javaagent:${configurations.testRuntimeClasspath.find { it.name.contains('mockito-core') }}", '-Xshare:off'
    systemProperty "spring.profiles.active", "config"
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += "-Xlint:deprecation"
}
